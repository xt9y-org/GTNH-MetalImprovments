name: Build client mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'
      - name: Format GTNH Java sources
        run: gradle --no-daemon spotlessApply
      - name: Commit standardized formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- src/main/java src/mixin/java; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/main/java src/mixin/java
            git commit -m "style: apply GTNH Java formatting"
            git push
          fi
      - name: Build mod JAR
        run: gradle --no-daemon build
      - name: Upload client JAR
        uses: actions/upload-artifact@v4
        with:
          name: GTNH-MetalImprovements
          path: build/libs/*.jar
          if-no-files-found: error
